name: Update season schedule

on:
  schedule:
    - cron: "17 9,21 * * *"   # about 4 AM and 4 PM Central, every day
  workflow_dispatch:          # adds a "Run workflow" button so you can run it any time

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build season.json
        run: node build-season.mjs
      - name: Build stats.json
        run: node build-stats.mjs
        continue-on-error: true
      - name: Save them to the repo
        run: |
          git config user.name "season-bot"
          git config user.email "season-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update season schedule" && git push)
